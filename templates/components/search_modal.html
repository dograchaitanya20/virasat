<div x-data="{ open: false, query: '' }"
     id="global-search-modal"
     @open-search-modal.window="open = true; $nextTick(() => $refs.searchInput.focus())"
     @keydown.escape.window="open = false"
     x-show="open" x-cloak
     class="fixed inset-0 z-50 flex items-start justify-center pt-16 sm:pt-24 px-4 bg-slate-950/70 backdrop-blur-md">
     
  <div @click.outside="open = false"
       class="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-amber-500/30 overflow-hidden transform transition-all">
    
    <!-- Search Bar Input Header -->
    <div class="relative flex items-center px-4 py-3 border-b border-slate-200 dark:border-slate-800">
      <svg class="w-5 h-5 text-amber-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input x-ref="searchInput"
             x-model="query"
             type="text"
             name="q"
             autocomplete="off"
             placeholder="Search monuments, festivals, dance forms, recipes, states..."
             hx-get="{% url 'core:quick_search' %}"
             hx-trigger="input changed delay:250ms, search"
             hx-target="#search-results"
             hx-indicator="#search-spinner"
             class="w-full bg-transparent text-slate-900 dark:text-slate-100 placeholder-slate-400 text-base focus:outline-none font-medium">
      
      <!-- Loading Spinner -->
      <div id="search-spinner" class="htmx-indicator mr-2">
        <svg class="animate-spin h-4 w-4 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </div>

      <button @click="open = false" class="text-xs px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-700 dark:hover:text-slate-200">
        ESC
      </button>
    </div>

    <!-- Search Results Container -->
    <div id="search-results" class="max-h-[60vh] overflow-y-auto p-4 space-y-4">
      <!-- Default Prompt before typing -->
      <div class="py-8 text-center text-slate-400 space-y-3">
        <div class="w-12 h-12 mx-auto rounded-full bg-amber-500/10 flex items-center justify-center text-amber-500">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
        </div>
        <p class="text-sm">Search through India's rich cultural treasury</p>
        <div class="flex flex-wrap justify-center gap-2 pt-2">
          <span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">Taj Mahal</span>
          <span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">Kathak</span>
          <span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">Diwali</span>
          <span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">Hampi</span>
          <span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">Madhubani</span>
        </div>
      </div>
    </div>

    <!-- Quick Footer Tip -->
    <div class="px-4 py-2.5 bg-slate-50 dark:bg-slate-950/80 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-500 flex items-center justify-between">
      <span>Use <kbd class="font-mono bg-slate-200 dark:bg-slate-800 px-1 py-0.5 rounded">↑</kbd> <kbd class="font-mono bg-slate-200 dark:bg-slate-800 px-1 py-0.5 rounded">↓</kbd> to navigate</span>
      <span>Press <kbd class="font-mono bg-slate-200 dark:bg-slate-800 px-1 py-0.5 rounded">ESC</kbd> to close</span>
    </div>

  </div>
</div>
