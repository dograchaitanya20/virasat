<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="{{ extra_classes|default:'w-full h-full' }}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="{{ title|default:'Cultural Archive' }}">
  <defs>
    {% if category == 'festivals' %}
      <linearGradient id="phGrad_{{ title|slugify|default:'item' }}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#831843" />
        <stop offset="50%" stop-color="#be185d" />
        <stop offset="100%" stop-color="#f59e0b" />
      </linearGradient>
    {% elif category == 'arts' %}
      <linearGradient id="phGrad_{{ title|slugify|default:'item' }}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#312e81" />
        <stop offset="50%" stop-color="#4c1d95" />
        <stop offset="100%" stop-color="#7c3aed" />
      </linearGradient>
    {% elif category == 'cuisine' %}
      <linearGradient id="phGrad_{{ title|slugify|default:'item' }}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7c2d12" />
        <stop offset="50%" stop-color="#c2410c" />
        <stop offset="100%" stop-color="#d97706" />
      </linearGradient>
    {% elif category == 'stories' %}
      <linearGradient id="phGrad_{{ title|slugify|default:'item' }}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="50%" stop-color="#334155" />
        <stop offset="100%" stop-color="#0f172a" />
      </linearGradient>
    {% else %}
      <linearGradient id="phGrad_{{ title|slugify|default:'item' }}" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#451a03" />
        <stop offset="50%" stop-color="#78350f" />
        <stop offset="100%" stop-color="#b45309" />
      </linearGradient>
    {% endif %}
    <pattern id="phPattern_{{ title|slugify|default:'item' }}" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="20" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.12"/>
      <path d="M 0 30 L 30 0 L 60 30 L 30 60 Z" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#phGrad_{{ title|slugify|default:'item' }})" />
  <rect width="800" height="500" fill="url(#phPattern_{{ title|slugify|default:'item' }})" />

  <rect x="25" y="25" width="750" height="450" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="35" y="35" width="730" height="430" rx="8" fill="none" stroke="#fbbf24" stroke-width="0.75" stroke-dasharray="6 4" stroke-opacity="0.3" />

  <!-- Category badge -->
  <g transform="translate(400, 140)">
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#000000" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.6"/>
    <text text-anchor="middle" y="4" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#fef3c7">
      {{ category|upper|default:'CULTURAL HERITAGE' }}
    </text>
  </g>

  <!-- Title -->
  <text x="400" y="260" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="1" fill="#fffbeb">
    {{ title|default:'Cultural Archive' }}
  </text>

  <!-- Ornamental line -->
  <g transform="translate(400, 290)">
    <line x1="-120" y1="0" x2="-15" y2="0" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#fbbf24" fill-opacity="0.8"/>
    <line x1="15" y1="0" x2="120" y2="0" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" letter-spacing="1.5" fill="#fde68a" fill-opacity="0.85">
    ARCHIVAL RECORD • VIRASAT
  </text>
</svg>
