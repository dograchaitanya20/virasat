<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Cultural Archive">
  <defs>
    <linearGradient id="phStandAlone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <pattern id="phPatternStandAlone" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="20" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.12"/>
      <path d="M 0 30 L 30 0 L 60 30 L 30 60 Z" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#phStandAlone)" />
  <rect width="800" height="500" fill="url(#phPatternStandAlone)" />

  <rect x="25" y="25" width="750" height="450" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="35" y="35" width="730" height="430" rx="8" fill="none" stroke="#fbbf24" stroke-width="0.75" stroke-dasharray="6 4" stroke-opacity="0.3" />

  <g transform="translate(400, 150)">
    <rect x="-120" y="-14" width="240" height="28" rx="14" fill="#000000" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.6"/>
    <text text-anchor="middle" y="4" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#fef3c7">
      CULTURAL HERITAGE
    </text>
  </g>

  <text x="400" y="260" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="36" font-weight="700" letter-spacing="1.5" fill="#fffbeb">
    Virasat Archive
  </text>

  <g transform="translate(400, 290)">
    <line x1="-120" y1="0" x2="-15" y2="0" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#fbbf24" fill-opacity="0.8"/>
    <line x1="15" y1="0" x2="120" y2="0" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>

  <text x="400" y="335" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="400" letter-spacing="2" fill="#fde68a" fill-opacity="0.85">
    PRESERVING INDIA'S ETERNAL HERITAGE
  </text>
</svg>